# Included in the existing nginx http context. The VPN listeners stay separate.
limit_conn_zone $binary_remote_addr zone=freedom_gpt_ip:1m;
limit_conn_zone $server_name zone=freedom_gpt_downloads:1m;

server {
    listen 80;
    listen [::]:80;
    server_name 185.125.100.186;
    root /var/www/freedom-gpt/current/public;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/freedom-gpt-access.log;
    error_log /var/log/nginx/freedom-gpt-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        default_type text/plain;
        return 200 "Freedom GPT OK\n";
    }
    location = /api/release {
        alias /var/www/freedom-gpt/shared/metadata/release.json;
        default_type application/json;
        expires -1;
    }
    location = /api/catalog {
        alias /var/www/freedom-gpt/current/public/api/catalog.json;
        default_type application/json;
        expires -1;
    }
    location = /api/models {
        alias /var/www/freedom-gpt/shared/metadata/models.json;
        default_type application/json;
        expires -1;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/greenedge-acme;
        try_files $uri =404;
    }
    location ~ ^/models/([a-z0-9][a-z0-9_-]*)/([A-Za-z0-9][A-Za-z0-9_.-]*\.(?:gguf|safetensors))$ {
        alias /var/www/freedom-gpt/shared/models/$1/$2;
        default_type application/octet-stream;
        limit_conn freedom_gpt_ip 2;
        limit_conn freedom_gpt_downloads 4;
        limit_rate 2m;
        autoindex off;
    }
    location /models/ { return 404; }
    location ~ ^/downloads/(FreedomGPT[-A-Za-z0-9.]*\.(?:exe|zip)|SHA256SUMS\.txt)$ {
        alias /var/www/freedom-gpt/shared/downloads/$1;
        default_type application/octet-stream;
        limit_conn freedom_gpt_ip 2;
        limit_conn freedom_gpt_downloads 4;
        limit_rate 2m;
        autoindex off;
    }
    location /downloads/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
